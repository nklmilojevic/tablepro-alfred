name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch info.plist version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import plistlib, sys
          path = "workflow/info.plist"
          with open(path, "rb") as f:
              p = plistlib.load(f)
          p["version"] = sys.argv[1]
          with open(path, "wb") as f:
              plistlib.dump(p, f)
          print(f"info.plist version -> {sys.argv[1]}")
          PY

      - name: Build .alfredworkflow
        run: ./build.sh

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" TablePro.alfredworkflow --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              TablePro.alfredworkflow
          fi
